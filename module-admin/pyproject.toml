[project]
name = "module-admin"
version = "0.1.0"
description = "ATTEND PLUS admin module"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "module-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/module_admin"]
sources = ["src"]
